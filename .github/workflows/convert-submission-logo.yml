name: Convert submission logo to AVIF

# Submission PRs (opened by the project form) carry the raw uploaded image in
# src/data/submissions/. Convert it to AVIF in src/logos/ and commit the result
# back to the PR branch, so the merged submission's "logo" path resolves.
on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    # the form only ever writes into this directory
    paths:
      - 'src/data/submissions/**'

permissions:
  contents: write

# one conversion at a time per PR branch; a fresh push supersedes an in-flight run
concurrency:
  group: logo-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  convert:
    runs-on: ubuntu-latest
    # Only form submissions: the form branches in gt-ospo directly and titles
    # its PRs "New Submission: <name>" (ProjectForm.jsx). Fork PRs like human
    # contributor branches would check out the wrong repo's ref and could
    # never push back with GITHUB_TOKEN anyway.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.title, 'New Submission:')
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        run: npm install --no-save sharp

      - name: Convert uploaded logos
        run: node scripts/convert_logos.mjs

      - name: Commit converted logo
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # src/data/submissions may not exist (non-submission PRs, or once the
          # raw upload is removed), so stage its parent to avoid a pathspec error
          git add -A src/logos src/data
          git diff --cached --quiet || git commit -m "Convert submission logo to AVIF"
          # push only back to the submission branch — never main
          git push origin "HEAD:refs/heads/$HEAD_REF"
